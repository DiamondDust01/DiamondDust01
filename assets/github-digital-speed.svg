<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" role="img" aria-labelledby="title description">
  <title id="title">Ideias em movimento</title>
  <desc id="description">Uma velocidade digital alta muda em sequência, como um velocímetro.</desc>
  <defs>
    <linearGradient id="speed-color" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <text x="450" y="27" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="3">IDEIAS EM MOVIMENTO</text>
  <g fill="url(#speed-color)" font-family="Cascadia Code, Consolas, monospace" font-size="54" font-weight="700" text-anchor="middle">
    <text x="420" y="87" opacity="1">248<animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="2.4s" repeatCount="indefinite"/></text>
    <text x="420" y="87" opacity="0">252<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="2.4s" repeatCount="indefinite"/></text>
    <text x="420" y="87" opacity="0">249<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="2.4s" repeatCount="indefinite"/></text>
    <text x="420" y="87" opacity="0">255<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="2.4s" repeatCount="indefinite"/></text>
  </g>
  <text x="565" y="83" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="1">km/h</text>
</svg>
