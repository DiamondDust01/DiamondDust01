<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" role="img" aria-labelledby="title description">
  <title id="title">Visualização animada de ideias em movimento</title>
  <desc id="description">Barras em azul e violeta pulsam em ritmos diferentes, formando uma visualização abstrata de atividade.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#15152d"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="896" height="106" rx="18" fill="url(#background)" stroke="#293548" stroke-width="2"/>
  <path d="M35 88 H865" stroke="#334155" stroke-width="1"/>
  <path d="M35 50 H865 M35 69 H865" stroke="#263247" stroke-width="1" stroke-dasharray="2 9" opacity=".8"/>
  <circle cx="55" cy="27" r="4" fill="#38bdf8">
    <animate attributeName="opacity" values=".4;1;.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="69" y="31" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2">IDEIAS EM MOVIMENTO</text>
  <text x="845" y="31" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="end" letter-spacing="1.5">CÓDIGO · DADOS · CRIATIVIDADE</text>
  <g fill="url(#bars)" filter="url(#glow)">
