<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" role="img" aria-labelledby="title description">
  <title id="title">Trilha animada de desenvolvimento</title>
  <desc id="description">Uma trilha de commits conecta explorar, construir e compartilhar, com um pulso luminoso percorrendo os nós.</desc>
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="896" height="106" rx="18" fill="#111827" stroke="#293548" stroke-width="2"/>
  <path d="M92 54 H808" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <path d="M92 54 H808" fill="none" stroke="url(#line)" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 10" opacity=".8"/>
  <path d="M320 54 C350 54 350 28 380 28 H435 M565 54 C595 54 595 80 625 80 H680" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M320 54 C350 54 350 28 380 28 H435 M565 54 C595 54 595 80 625 80 H680" fill="none" stroke="url(#line)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 7" opacity=".75"/>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" text-anchor="middle">
    <text x="205" y="34" fill="#7dd3fc">EXPLORAR</text>
    <text x="450" y="34" fill="#a5b4fc">CONSTRUIR</text>
    <text x="695" y="34" fill="#d8b4fe">COMPARTILHAR</text>
  </g>

  <g fill="#111827" stroke="url(#line)" stroke-width="3">
    <circle cx="205" cy="54" r="10"/>
    <circle cx="450" cy="54" r="10"/>
    <circle cx="695" cy="54" r="10"/>
    <circle cx="435" cy="28" r="6"/>
    <circle cx="680" cy="80" r="6"/>
  </g>
  <g fill="#e0f2fe">
    <circle cx="205" cy="54" r="3"/>
    <circle cx="450" cy="54" r="3"/>
    <circle cx="695" cy="54" r="3"/>
    <circle cx="435" cy="28" r="2"/>
    <circle cx="680" cy="80" r="2"/>
  </g>
  <circle r="6" fill="#fff" filter="url(#glow)">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M92 54 H808"/>
  </circle>
  <circle cx="450" cy="54" r="15" fill="none" stroke="#a5b4fc" stroke-width="2" opacity=".65">
    <animate attributeName="r" values="11;22;11" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".65;0;.65" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
