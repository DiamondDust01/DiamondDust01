<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 60" role="img" aria-labelledby="title description">
  <title id="title">Explorando, aprendendo e construindo</title>
  <desc id="description">Cada palavra é destacada em sequência, uma por segundo.</desc>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" letter-spacing=".5">
    <text x="160" y="30" fill="#94a3b8" font-weight="500">EXPLORANDO
      <animate attributeName="fill" values="#38bdf8;#94a3b8;#94a3b8;#38bdf8" keyTimes="0;.333;.666;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="font-weight" values="700;500;500;700" keyTimes="0;.333;.666;1" dur="3s" repeatCount="indefinite"/>
    </text>
    <circle cx="238" cy="25" r="2" fill="#475569"/>
    <text x="300" y="30" fill="#94a3b8" font-weight="500">APRENDENDO
      <animate attributeName="fill" values="#94a3b8;#a78bfa;#94a3b8;#94a3b8" keyTimes="0;.333;.666;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="font-weight" values="500;700;500;500" keyTimes="0;.333;.666;1" dur="3s" repeatCount="indefinite"/>
    </text>
    <circle cx="365" cy="25" r="2" fill="#475569"/>
    <text x="440" y="30" fill="#94a3b8" font-weight="500">CONSTRUINDO
      <animate attributeName="fill" values="#94a3b8;#94a3b8;#34d399;#94a3b8" keyTimes="0;.333;.666;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="font-weight" values="500;500;700;500" keyTimes="0;.333;.666;1" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
