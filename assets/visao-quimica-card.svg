<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-labelledby="title description">
  <title id="title">Visão Química</title>
  <desc id="description">Cartão animado do projeto de estudo e treino de Química.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#102c35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="556" height="276" rx="20" fill="url(#card)" stroke="#20434a" stroke-width="2"/>
  <rect x="3" y="3" width="554" height="274" rx="19" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="110 1550">
    <animate attributeName="stroke-dashoffset" from="0" to="-1660" dur="9s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(474 72)" fill="none" stroke="#2dd4bf" stroke-width="2" opacity=".55">
    <ellipse rx="39" ry="15"/>
    <ellipse rx="39" ry="15" transform="rotate(60)"/>
    <ellipse rx="39" ry="15" transform="rotate(120)"/>
    <circle r="5" fill="#a78bfa" stroke="none"/>
    <circle cx="39" r="3" fill="#2dd4bf" stroke="none"/>
  </g>
  <text x="38" y="54" fill="#5eead4" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">PROJETO 02</text>
  <text x="38" y="119" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="33" font-weight="700">🧪 Visão Química</text>
  <text x="40" y="158" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="17">Estudo e treino de Química</text>
  <rect x="38" y="190" width="92" height="32" rx="16" fill="#123d40"/>
  <text x="84" y="211" fill="#99f6e4" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">OFFLINE</text>
  <rect x="138" y="190" width="64" height="32" rx="16" fill="#123d40"/>
  <text x="170" y="211" fill="#99f6e4" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">WEB</text>
  <rect x="210" y="190" width="94" height="32" rx="16" fill="#123d40"/>
  <text x="257" y="211" fill="#99f6e4" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">ANDROID</text>
  <rect x="312" y="190" width="94" height="32" rx="16" fill="#123d40"/>
  <text x="359" y="211" fill="#99f6e4" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">WINDOWS</text>
  <text x="38" y="251" fill="#5eead4" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">EXPLORAR REPOSITÓRIO  ↗</text>
</svg>