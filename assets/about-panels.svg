<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 142" role="img" aria-labelledby="title description">
  <title id="title">Interesses e áreas de exploração</title>
  <desc id="description">Três painéis animados sobre dados e analytics, machine learning e desenvolvimento.</desc>
  <defs>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2437"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="learning" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#21183b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="dev" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102b2d"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="8" y="8" width="284" height="126" rx="14" fill="url(#data)" stroke="#164e63"/>
    <text x="26" y="35" fill="#7dd3fc" font-size="12" font-weight="700" letter-spacing="1.5">DADOS &amp; ANALYTICS</text>
    <path d="M27 109 H270" stroke="#334155" stroke-width="1"/>
    <rect x="42" y="81" width="22" height="28" rx="4" fill="#0ea5e9">
      <animate attributeName="height" values="17;28;17" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="92;81;92" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="78" y="64" width="22" height="45" rx="4" fill="#38bdf8">
      <animate attributeName="height" values="34;45;34" dur="2.4s" begin=".3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="75;64;75" dur="2.4s" begin=".3s" repeatCount="indefinite"/>
    </rect>
    <rect x="114" y="74" width="22" height="35" rx="4" fill="#0ea5e9">
      <animate attributeName="height" values="25;35;25" dur="2.4s" begin=".6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="84;74;84" dur="2.4s" begin=".6s" repeatCount="indefinite"/>
    </rect>
    <rect x="150" y="52" width="22" height="57" rx="4" fill="#7dd3fc">
      <animate attributeName="height" values="43;57;43" dur="2.4s" begin=".9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="66;52;66" dur="2.4s" begin=".9s" repeatCount="indefinite"/>
    </rect>
    <path d="M190 87 L209 70 L228 77 L254 50" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="90" stroke-dashoffset="90">
      <animate attributeName="stroke-dashoffset" values="90;0;0;90" dur="4s" repeatCount="indefinite"/>
    </path>
    <circle cx="254" cy="50" r="4" fill="#67e8f9">
      <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <rect x="308" y="8" width="284" height="126" rx="14" fill="url(#learning)" stroke="#4c1d95"/>
    <text x="326" y="35" fill="#c4b5fd" font-size="12" font-weight="700" letter-spacing="1.5">MACHINE LEARNING</text>
    <g fill="none" stroke="#7c3aed" stroke-width="1.5" opacity=".8">
      <path d="M365 70 L413 58 L458 79 L505 55"/>
      <path d="M365 70 L407 101 L458 79 L503 100"/>
      <path d="M413 58 L407 101 M458 79 L505 55 M458 79 L503 100"/>
    </g>
    <g fill="#111827" stroke-width="2">
      <circle cx="365" cy="70" r="6" stroke="#a78bfa"/>
      <circle cx="413" cy="58" r="6" stroke="#c4b5fd"/>
      <circle cx="407" cy="101" r="6" stroke="#8b5cf6"/>
      <circle cx="458" cy="79" r="8" stroke="#c4b5fd"/>
      <circle cx="505" cy="55" r="6" stroke="#a78bfa"/>
      <circle cx="503" cy="100" r="6" stroke="#8b5cf6"/>
    </g>
    <circle cx="458" cy="79" r="4" fill="#c4b5fd">
      <animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;1;.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="365" cy="70" r="3" fill="#c4b5fd">
      <animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="505" cy="55" r="3" fill="#c4b5fd">
      <animate attributeName="opacity" values=".3;1;.3" dur="2s" begin=".7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="503" cy="100" r="3" fill="#c4b5fd">
      <animate attributeName="opacity" values=".3;1;.3" dur="2s" begin="1.4s" repeatCount="indefinite"/>
    </circle>

    <rect x="608" y="8" width="284" height="126" rx="14" fill="url(#dev)" stroke="#115e59"/>
    <text x="626" y="35" fill="#5eead4" font-size="12" font-weight="700" letter-spacing="1.5">DESENVOLVIMENTO</text>
    <text x="652" y="92" fill="#5eead4" font-family="Cascadia Code, Consolas, monospace" font-size="34" font-weight="500">&lt;/&gt;</text>
    <text x="740" y="89" fill="#99f6e4" font-family="Cascadia Code, Consolas, monospace" font-size="15">ideias()</text>
    <rect x="811" y="75" width="3" height="21" rx="1" fill="#5eead4">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <path d="M740 103 H836" stroke="#134e4a" stroke-width="2" stroke-linecap="round"/>
    <path d="M740 103 H786" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 100;46 100;0 100" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
