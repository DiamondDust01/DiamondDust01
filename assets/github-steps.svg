<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 60" role="img" aria-labelledby="title description">
  <title id="title">Etapas no GitHub</title>
  <desc id="description">Explorando, aprendendo e construindo, com três pontos que se iluminam em sequência.</desc>
  <text x="300" y="24" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.5">EXPLORANDO  ·  APRENDENDO  ·  CONSTRUINDO</text>
  <g>
    <circle cx="278" cy="43" r="3" fill="#38bdf8" opacity=".3">
      <animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;4.5;3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="43" r="3" fill="#818cf8" opacity=".3">
      <animate attributeName="opacity" values=".3;1;.3" dur="1.8s" begin=".6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;4.5;3" dur="1.8s" begin=".6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="322" cy="43" r="3" fill="#c084fc" opacity=".3">
      <animate attributeName="opacity" values=".3;1;.3" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;4.5;3" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
