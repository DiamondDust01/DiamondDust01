<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-labelledby="title description">
  <title id="title">Começos de código em nove linguagens</title>
  <desc id="description">Exemplos curtos de Python, JavaScript, C#, C++, C, Java, HTML, CSS e SQL, com destaque animado em cada linha.</desc>
  <rect x="2" y="2" width="616" height="246" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <path d="M3 40 H617" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="23" cy="21" r="4" fill="#fb7185"/>
  <circle cx="38" cy="21" r="4" fill="#fbbf24"/>
  <circle cx="53" cy="21" r="4" fill="#34d399"/>
  <text x="310" y="25" fill="#57606a" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle" letter-spacing="1.5">PRIMEIROS PASSOS · 9 LINGUAGENS</text>

  <rect x="13" y="45" width="594" height="20" rx="4" fill="#38bdf8" opacity=".2">
    <animate attributeName="y" values="45;65;85;105;125;145;165;185;205;45" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>

  <g font-family="Cascadia Code, Consolas, monospace" font-size="15">
    <text x="27" y="61" fill="#0969da">Python</text>
    <text x="142" y="61" fill="#24292f">print("Olá, mundo!")</text>

    <text x="27" y="81" fill="#9a6700">JavaScript</text>
    <text x="142" y="81" fill="#24292f">console.log("Olá, mundo!");</text>

    <text x="27" y="101" fill="#8250df">C#</text>
    <text x="142" y="101" fill="#24292f">Console.WriteLine("Olá, mundo!");</text>

    <text x="27" y="121" fill="#0550ae">C++</text>
    <text x="142" y="121" fill="#24292f">std::cout &lt;&lt; "Olá, mundo!";</text>

    <text x="27" y="141" fill="#0969da">C</text>
    <text x="142" y="141" fill="#24292f">printf("Olá, mundo!");</text>

    <text x="27" y="161" fill="#bc4c00">Java</text>
    <text x="142" y="161" fill="#24292f">System.out.println("Olá, mundo!");</text>

    <text x="27" y="181" fill="#bc4c00">HTML</text>
    <text x="142" y="181" fill="#24292f">&lt;h1&gt;Olá, mundo!&lt;/h1&gt;</text>

    <text x="27" y="201" fill="#0969da">CSS</text>
    <text x="142" y="201" fill="#24292f">body { color: #38bdf8; }</text>

    <text x="27" y="221" fill="#8250df">SQL</text>
    <text x="142" y="221" fill="#24292f">SELECT 'Olá, mundo!';</text>
  </g>
</svg>
