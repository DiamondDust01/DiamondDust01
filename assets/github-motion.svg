<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 86" role="img" aria-labelledby="title description">
  <title id="title">Atividade no GitHub</title>
  <desc id="description">Frase centralizada com um destaque animado sutil.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <text x="550" y="48" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="3">EXPLORANDO  ·  APRENDENDO  ·  CONSTRUINDO</text>
  <rect x="445" y="65" width="210" height="2" rx="1" fill="#1e293b"/>
  <rect x="445" y="65" width="42" height="2" rx="1" fill="url(#accent)">
    <animate attributeName="x" values="445;613;445" dur="5s" repeatCount="indefinite"/>
  </rect>
