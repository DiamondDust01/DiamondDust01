<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 86" role="img" aria-labelledby="title description">
  <title id="title">Atividade no GitHub</title>
  <desc id="description">Barras animadas ao lado da frase explorando, aprendendo e construindo.</desc>
  <defs>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <g fill="url(#bars)">
    <rect x="395" y="47" width="9" height="20" rx="4">
      <animate attributeName="height" values="12;28;12" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="55;39;55" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="411" y="39" width="9" height="28" rx="4">
      <animate attributeName="height" values="27;13;27" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="40;54;40" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="427" y="44" width="9" height="23" rx="4">
      <animate attributeName="height" values="15;29;15" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="52;38;52" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="443" y="34" width="9" height="33" rx="4">
      <animate attributeName="height" values="30;16;30" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="37;51;37" dur="1.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="470" y="57" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3">EXPLORANDO  ·  APRENDENDO  ·  CONSTRUINDO</text>
</svg>
