<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" role="img" aria-labelledby="title description">
  <title id="title">Velocímetro animado de ideias em movimento</title>
  <desc id="description">O ponteiro percorre uma escala azul e violeta, representando ideias que ganham ritmo e viram projetos.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#15152d"/>
    </linearGradient>
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".52" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="896" height="106" rx="18" fill="url(#background)" stroke="#293548" stroke-width="2"/>
  <text x="450" y="20" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="2">IDEIAS EM MOVIMENTO</text>
  <path d="M302 91 A148 63 0 0 1 598 91" fill="none" stroke="#293548" stroke-width="9" stroke-linecap="round"/>
  <path d="M302 91 A148 63 0 0 1 598 91" fill="none" stroke="url(#scale)" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#64748b" stroke-width="2" stroke-linecap="round">
    <path d="M312 91 L323 91"/>
    <path d="M321 67 L331 71"/>
    <path d="M347 47 L355 55"/>
    <path d="M385 32 L389 43"/>
    <path d="M450 28 L450 40"/>
    <path d="M515 32 L511 43"/>
    <path d="M553 47 L545 55"/>
    <path d="M579 67 L569 71"/>
    <path d="M588 91 L577 91"/>
  </g>
  <g fill="#7dd3fc">
    <circle cx="302" cy="91" r="3"/>
    <circle cx="450" cy="28" r="3"/>
    <circle cx="598" cy="91" r="3"/>
  </g>
  <g transform="rotate(-72 450 91)">
    <path d="M450 91 L450 43" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="450" cy="47" r="4" fill="#fff" filter="url(#glow)"/>
    <animateTransform attributeName="transform" type="rotate" values="-72 450 91;70 450 91;18 450 91;-72 450 91" keyTimes="0;.48;.7;1" dur="4s" repeatCount="indefinite"/>
  </g>
  <circle cx="450" cy="91" r="10" fill="#111827" stroke="url(#scale)" stroke-width="4"/>
  <circle cx="450" cy="91" r="3" fill="#e0f2fe"/>
  <text x="290" y="103" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="9" text-anchor="end" letter-spacing="1.2">IMAGINAR</text>
  <text x="610" y="103" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="9" letter-spacing="1.2">CRIAR</text>
  <path d="M130 57 H235 M665 57 H770" stroke="#334155" stroke-width="1" stroke-dasharray="3 7"/>
  <circle cx="130" cy="57" r="3" fill="#38bdf8" opacity=".8"/>
  <circle cx="770" cy="57" r="3" fill="#c084fc" opacity=".8"/>
</svg>
