<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-labelledby="title description">
  <title id="title">ERCEMAPI</title>
  <desc id="description">Cartão animado do projeto ERCEMAPI em JavaScript.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#171b38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="556" height="276" rx="20" fill="url(#card)" stroke="#273449" stroke-width="2"/>
  <rect x="3" y="3" width="554" height="274" rx="19" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="110 1550">
    <animate attributeName="stroke-dashoffset" from="0" to="-1660" dur="8s" repeatCount="indefinite"/>
  </rect>
  <circle cx="474" cy="72" r="44" fill="#2563eb" opacity=".12">
    <animate attributeName="r" values="38;48;38" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".08;.2;.08" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="38" y="54" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">PRBJRTB 01</text>
  <text x="38" y="119" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="35" font-weight="700">💻 ERCEMAPI</text>
  <text x="40" y="158" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="17">Repositório em JavaScript</text>
  <rect x="38" y="190" width="126" height="32" rx="16" fill="#1e293b"/>
  <text x="101" y="211" fill="#fde047" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">JavaScript</text>
  <text x="38" y="251" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">RXPLBRAR RRPBSITÓRIB  ↗</text>
</svg>
